<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narration Checker</title>
<style>
  :root { --bg: #0f0b09; --card: #1c1511; --line: #382a20; --ink: #efe3d3; --mute: #8f7a63; --gold: #e2bf7a; --good: #8cc28f; --bad: #e0705a; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 Georgia, serif; max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { color: var(--gold); font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--mute); margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .ok { color: var(--good); } .bad { color: var(--bad); }
  .ex { font-size: .9rem; color: var(--mute); border-top: 1px solid var(--line); padding: 6px 0; }
  .ex b { color: var(--ink); font-weight: normal; }
  h2 { font-size: 1.1rem; color: var(--gold); margin: 0 0 8px; font-weight: 600; }
</style>
</head>
<body>
<h1>Narration Checker</h1>
<div class="sub">Assembles every combination of encounter lines (built-in plus your <code>narration.custom.js</code>) for male and female clients and checks the grammar. Edit your file, then reload this page.</div>
<div id="out">Checking…</div>

<script src="narration.js"></script>
<script src="narration.custom.js"></script>
<script>
"use strict";
const NAMES = { missionary: "Missionary", cowgirl: "Cowgirl", reverse_cowgirl: "Reverse Cowgirl", doggy_style: "Doggy Style", spooning: "Spooning", standing: "Standing", "69": "69", lotus: "Lotus", pretzel_dip: "Pretzel Dip", coital_alignment_techniq: "Coital Alignment", leapfrog: "Leapfrog", scissoring: "Scissoring", tabletop: "Tabletop", "side_by_side_face-to-fac": "Side by Side",
  bondage: "Bondage", spanking: "Spanking", roleplay: "Roleplay", sensory_deprivation: "Sensory Deprivation", temperature_play: "Temperature Play", dominance_and_submission: "Dominance & Submission", praise_kink: "Praise", dirty_talk: "Dirty Talk", voyeurism: "Voyeurism", exhibitionism: "Exhibitionism", foot_fetish: "Foot Fetish", impact_play: "Impact Play" };
const PRON = {
  male: { they: "he", them: "him", their: "his", themself: "himself", s: "s", es: "es", are: "is" },
  female: { they: "she", them: "her", their: "her", themself: "herself", s: "s", es: "es", are: "is" }
};
const isObj = v => v && typeof v === "object" && !Array.isArray(v);
function merge(base, add) {
  if (Array.isArray(base) && Array.isArray(add)) return base.concat(add);
  if (isObj(base) && isObj(add)) {
    if (add.replace) { const o = { ...add }; delete o.replace; return { ...base, ...o }; }
    const out = { ...base }; Object.keys(add).forEach(k => { out[k] = k in base ? merge(base[k], add[k]) : add[k]; }); return out;
  }
  return add === undefined ? base : add;
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
function fill(line, c, move) {
  const map = { name: "Isabeau", client: c.label, move, ...PRON[c.cg] };
  return line.replace(/\{(\w+)\}/g, (m, k) => {
    const lower = k.charAt(0).toLowerCase() + k.slice(1);
    const v = map[k] !== undefined ? map[k] : map[lower];
    if (v === undefined) return m;
    return k !== lower ? cap(String(v)) : String(v);
  });
}
const T = x => typeof x === "string" ? x : x.t;
const okFor = (list, tags) => (list || []).filter(x => typeof x === "string" || !(x.not || []).some(g => tags.includes(g))).map(T);

const out = document.getElementById("out");
if (!window.NARRATION) {
  out.innerHTML = `<div class="card bad">narration.js didn't load. Keep checker.html in the same folder as narration.js.</div>`;
} else {
  const custom = window.NARRATION_CUSTOM;
  const N = custom ? merge(window.NARRATION, custom) : window.NARRATION;
  let customCount = 0;
  (function count(v) { if (Array.isArray(v)) customCount += v.length; else if (isObj(v)) Object.values(v).forEach(count); })(custom || {});

  const clients = [{ label: "Marlow", cg: "male" }, { label: "Madam Briar", cg: "female" }, { label: "your client", cg: "male" }, { label: "your client", cg: "female" }, { label: "the patron", cg: "female" }];
  const VERBS = "are|were|have|do|want|love|take|leave|come|go|breathe|groan|moan|murmur|watch|kiss|obey|shiver|tremble|gasp|grip|push|let|jump|melt|make|blush|hope|wait|hover|tolerate|cling|crave|know|lie|sprawl|laugh|dress|smile|flinch|press|reach|catch|arch|beg|sigh|whisper|pull|hold|feel|look";
  const issues = {}; let total = 0; const samples = [];
  const bad = (k, s) => { issues[k] = issues[k] || { n: 0, ex: [] }; issues[k].n++; if (issues[k].ex.length < 4) issues[k].ex.push(s); };
  function check(s, c) {
    total++;
    if (/\{\w+\}/.test(s)) bad("Unknown or unfilled token", s);
    if (new RegExp(`\\b(he|she)\\s+(?:\\w+ly\\s+)?(${VERBS})\\b`, "i").test(s)) bad("Verb doesn't agree (add {s}, {es} or {are})", s);
    if (/^[a-z]/.test(s) || /[.!?]["”]?\s+[a-z]/.test(s)) bad("Sentence starts lowercase (use {Client} or {They})", s);
    if (/ {2}| [,.!?:]/.test(s)) bad("Extra spaces", s);
    if (/\b[aA] [aeiouAEIOU]/.test(s)) bad("'a' before a vowel", s);
    if (/\b(\w+) \1\b/i.test(s)) bad("Doubled word", s);
    if (!/[.!?"”]$/.test(s)) bad("Missing end punctuation", s);
    if (c.cg === "male" && /\b(she|her|hers|herself)\b/i.test(s)) bad("Female pronoun with a male client (use {they}/{their})", s);
    if (c.cg === "female" && /\b(he|him|his|himself)\b/i.test(s)) bad("Male pronoun with a female client (use {they}/{their})", s);
    if ((s.match(new RegExp(c.label, "gi")) || []).length > 2) bad("Client named 3+ times in one turn (use pronouns)", s);
  }
  const missing = [];
  for (const c of clients) {
    for (const id of Object.keys(NAMES)) {
      const tech = (N.techniques || {})[id];
      if (!tech) { missing.push(id); continue; }
      const tags = tech.tags || [];
      const f = l => fill(l, c, NAMES[id]);
      const mains = [];
      ["success", "fail"].forEach(o => (tech[o] || []).map(T).forEach(l => mains.push({ o, l, pose: true })));
      (tech.repeat || []).map(T).forEach(l => mains.push({ o: "fail", l, pose: true, rep: true }));
      (tech.focus || []).map(T).forEach(l => mains.push({ o: "success", l, pose: true }));
      Object.keys(N.approaches || {}).forEach(k => ["success", "fail"].forEach(o => okFor(N.approaches[k][o], tags).forEach(l => mains.push({ o, l }))));
      for (const m of mains) {
        const starts = m.pose && !m.rep ? ["", ...okFor(tech.start, tags)] : [""];
        const variants = [{ main: m.l, prefs: m.pose && !m.rep && m.o === "success" ? ["", ...okFor(N.liked, tags)] : [""] }];
        if (m.pose && !m.rep && m.o === "success") okFor(N.disliked, tags).forEach(d => variants.push({ main: d, prefs: [""] }));
        for (const v of variants) for (const st of starts) for (const pf of v.prefs) for (const band of ["low", "mid", "high"]) {
          const rb = (N.reactions || {})[band] || {};
          for (const r of okFor(Array.isArray(rb) ? rb : rb[m.o], tags)) {
            const s = [st, v.main, pf, r].filter(Boolean).map(f).join(" ");
            check(s, c);
            if (Math.random() < 0.0004 && samples.length < 12) samples.push(`[${NAMES[id]}, ${c.cg} client] ${s}`);
          }
        }
      }
      for (const ctx of ["street", "brothel", "manager"]) for (const o of okFor((N.open || {})[ctx], tags)) for (const tp of ["", ...Object.values(N.temperament || {}).flat().map(T)]) for (const st of okFor(tech.start, tags)) check([o, tp, st].filter(Boolean).map(f).join(" "), c);
    }
    for (const o of ["success", "fail"]) for (const l of okFor((N.finish || {})[o], [])) check(fill(l, c, "Missionary"), c);
  }
  const keys = Object.keys(issues);
  out.innerHTML = `
    <div class="card"><h2>Summary</h2>
      <div>${custom ? `Your file <b>narration.custom.js</b> loaded with <b>${customCount}</b> line${customCount === 1 ? "" : "s"}.` : `No <b>narration.custom.js</b> found — checking built-in lines only.`}</div>
      <div>${total.toLocaleString()} combinations checked.</div>
      ${missing.length ? `<div class="bad">Techniques with no lines at all: ${missing.join(", ")}</div>` : ""}
      <div class="${keys.length ? "bad" : "ok"}" style="margin-top:6px">${keys.length ? `${keys.length} kind${keys.length === 1 ? "" : "s"} of issue found.` : "No issues found. Your lines fit."}</div>
    </div>
    ${keys.map(k => `<div class="card"><h2 class="bad">${k} — ${issues[k].n.toLocaleString()} combination${issues[k].n === 1 ? "" : "s"}</h2>${issues[k].ex.map(e => `<div class="ex"><b>${esc(e)}</b></div>`).join("")}</div>`).join("")}
    <div class="card"><h2>Random samples</h2>${samples.map(s => `<div class="ex"><b>${esc(s)}</b></div>`).join("")}</div>`;
}
</script>
</body>
</html>

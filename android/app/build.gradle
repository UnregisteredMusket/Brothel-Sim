plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv("VERSION_CODE") ?: "1") as int

android {
    namespace 'com.unregisteredmusket.courtesan'
    compileSdk 34

    defaultConfig {
        applicationId 'com.unregisteredmusket.courtesan'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.${buildNumber}"
    }

    // A fixed key so each new APK installs over the last one and keeps your saves.
    // This keystore is public in the repo: fine for personal sideloading, not for a store listing.
    signingConfigs {
        shared {
            storeFile file('../courtesan.keystore')
            storeType 'pkcs12'
            storePassword 'courtesan-public'
            keyAlias 'courtesan'
            keyPassword 'courtesan-public'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}

function isPlainObject(v) { return v && typeof v === "object" && !Array.isArray(v); }
function deepMerge(base, over) {
  if (!isPlainObject(base) || !isPlainObject(over)) return over === undefined ? base : over;
  const out = { ...base };
  Object.keys(over).forEach(k => { out[k] = deepMerge(base[k], over[k]); });
  return out;
}

/* =========================================================

   ========================================================= */
const $ = id => document.getElementById(id);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const sign = n => (n >= 0 ? "+" : "") + n;

function getMod(s) { return Math.floor((s - 10) / 2); }
function getFameTier(f) { return FAME_TIERS.reduce((a, t) => f >= t.min ? t : a, FAME_TIERS[0]); }
function getFameIndex() { return FAME_TIERS.filter(t => state.fame >= t.min).length - 1; }
function isKink(id) { return INDEX.kinks.some(k => k.id === id); }
function isPosition(id) { return INDEX.positions.some(p => p.id === id); }
function getPosition(id) { return INDEX.positions.find(p => p.id === id) || INDEX.positions[0]; }
function contextOf() { return state.stage === "street" ? "street" : state.stage === "brothel" ? "brothel" : "manager"; }
function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function an(w) { return /^[aeiou]/i.test(String(w)) ? "an" : "a"; }
function lowHealthLimit() { return state.classFeatures.sturdy ? 15 : LOW_HEALTH_DISADVANTAGE; }
function maxHealth() { return state.character.motivation === "survival" ? 110 : 100; }
function retireAt() { return state.character.motivation === "freedom" ? 600 : 800; }
function priceOf(i) {
  const bg = state.character.background;
  if (i.id === "sanctuary" && bg === "Temple Raised") return 15;
  if (i.id === "bodyguard" && bg === "Camp Follower") return 40;
  return i.cost;
}
function controlMod() { return state.control >= 70 ? -2 : state.control <= 30 ? 2 : 0; }

function learnPosition(id) {
  if (!id || state.knownPositions.includes(id) || !isPosition(id)) return false;
  state.knownPositions.push(id);
  return true;
}
function grantClassPositions(extra) {
  const learned = [];
  const order = [...(SUBCLASS_POSITIONS[state.character.subclass] || []), ...(CLASS_POSITIONS[state.character.class] || []), ...INDEX.positions.map(p => p.id)];
  for (const id of order) {
    if (learned.length >= extra) break;
    if (learnPosition(id)) learned.push(getPosition(id).name);
  }
  return learned;
}

function getSkillBonus(name) {
  const attr = SKILL_ATTR[name] || "cha";
  const raw = state.skills[name] || 0;
  let b = getMod(state.attributes[attr]) + (raw >= 20 ? state.proficiencyBonus : 0) + Math.floor(raw / 25);
  if (state.upgrades.perfume && (name === "performance" || name === "kink" || name === "persuasion")) b += 1;
  return b - (state.exhaustion || 0);
}

function rollDie(n) { return Math.floor(Math.random() * n) + 1; }
function rollD20(adv, dis) {
  const a = rollDie(20), b = rollDie(20);
  if (adv && !dis) return { roll: Math.max(a, b), raw: [a, b], type: "advantage" };
  if (dis && !adv) return { roll: Math.min(a, b), raw: [a, b], type: "disadvantage" };
  return { roll: a, raw: [a], type: "" };
}
function chanceOf(bonus, dc, adv, dis) {
  let p = clamp((21 - (dc - bonus)) / 20, 0, 1);
  if (adv && !dis) p = 1 - (1 - p) * (1 - p);
  else if (dis && !adv) p = p * p;
  return p;
}
function skillMeta(skill, opts = {}) {
  return {
    label: SKILL_LABEL[skill] || cap(skill),
    bonus: getSkillBonus(skill) + (opts.bonus || 0),
    adv: !!(opts.advantage || (skill === "persuasion" && state.classFeatures.silverTongue)),
    dis: !!(opts.disadvantage || state.health < lowHealthLimit())
  };
}
function attrMeta(attr, opts = {}) {
  return {
    label: attr.toUpperCase(),
    bonus: getMod(state.attributes[attr]) - (state.exhaustion || 0) + (opts.bonus || 0),
    adv: !!opts.advantage,
    dis: !!(opts.disadvantage || state.health < lowHealthLimit())
  };
}
function odds(meta, dc) { return chanceOf(meta.bonus, dc, meta.adv, meta.dis); }
function check(meta, dc) {
  const d = rollD20(meta.adv, meta.dis);
  const total = d.roll + meta.bonus;
  const r = { label: meta.label, bonus: meta.bonus, dc, total, roll: d.roll, raw: d.raw, type: d.type, success: total >= dc };
  Game.lastRoll = r;
  Game.log(`${r.label} check: rolled ${r.raw.join("/")}${r.type ? " (" + r.type + ")" : ""} ${sign(r.bonus)} = ${r.total} vs ${dc}. ${r.success ? "Success" : "Failure"}.`, "roll");
  return r;
}

function getXpForLevel(l) { return 80 + (l - 1) * 60; }
function checkLevelUp() {
  const msgs = [];
  while (state.xp >= state.xpToNext && state.level < 12) {
    state.xp -= state.xpToNext;
    state.level++;
    state.xpToNext = getXpForLevel(state.level);
    if (state.level % 2 === 0) state.proficiencyBonus = Math.min(6, state.proficiencyBonus + 1);
    state.inspiration = 1;
    const gained = grantClassPositions(state.character.subclass ? 2 : 1);
    msgs.push(`Level ${state.level}!${gained.length ? " You learn " + gained.join(" and ") + "." : ""} Inspiration gained.`);
    state.pendingLevelUps++;
  }
  return msgs;
}

function clientCap(ctx) { return (ctx === "manager" ? 2 : 3) + (state.phaseMods.extraClients || 0); }
function whyCantWork(ctx) {
  if (state.health < MIN_HEALTH_TO_WORK) return "Too injured. Rest or see a physician.";
  if (state.energy < (ctx === "manager" ? 12 : 15)) return "Too tired. Rest first.";
  if (state.flags.clientsThisPhase >= clientCap(ctx)) return `No more clients this ${state.phase}.`;
  return "";
}

function grossPay(ctx, item, patron) {
  let pay = ctx === "street" ? 8 : ctx === "brothel" ? 14 : 28;
  pay += (item.risk - 1) * 3;
  if (state.character.appearance === "striking") pay += 3;
  if (state.character.appearance === "plain") pay = Math.max(4, pay - 2);
  if (state.classFeatures.allure) pay += 2;
  if (state.upgrades.clothes) pay += 2;
  if (state.upgrades.corner && ctx === "street") pay += 2;
  if (state.character.motivation === "debt") pay *= 1.1;
  pay = Math.round(pay * (state.phaseMods.payMult || 1));
  if (patron) pay *= 2;
  return pay;
}
function netFactor(ctx) { return ctx === "brothel" ? 1 - state.houseCut : 1; }

function rollClientType() {
  const types = Object.values(CLIENT_TYPES);
  const total = types.reduce((s, t) => s + t.weight, 0);
  let r = Math.random() * total;
  for (const t of types) { r -= t.weight; if (r <= 0) return t; }
  return CLIENT_TYPES.ordinary;
}

function adjustRel(id, d) {
  const npc = NPCS.find(n => n.id === id);
  if (!state.relationships[id]) state.relationships[id] = { name: npc ? npc.name : id, love: 0, lust: 0, trust: 0 };
  const r = state.relationships[id];
  ["love", "lust", "trust"].forEach(k => { r[k] = clamp(r[k] + (d[k] || 0), 0, 100); });
}
function rel(id) { return state.relationships[id] || { love: 0, trust: 0, lust: 0 }; }

function syncStaff() { state.staff = state.staffMembers.length; }

        row(state.coin >= req.coin, "Coin", `${state.coin}/${req.coin}`) +
        row(state.reputation >= req.reputation, "Reputation", `${state.reputation}/${req.reputation}`) +
        row(state.clientsServed >= req.clients, "Clients served", `${state.clientsServed}/${req.clients}`) +
        row(!state.debt, "Free of debt", state.debt ? state.debt : "✓"));
      if (Game.canAdvance()) UI.addChoices(p, [{ label: "Advance to the next stage", primary: true, action: () => { UI.showTab("work"); Game.advanceStage(); } }]);
    } else {
      const p = UI.panel(v, "Your house", `House reputation ${state.houseReputation} · reach 60 to claim the city's finest house`,
        UI.bar("House rep", state.houseReputation, 60, "var(--gold)"));
      UI.addChoices(p, [
        { label: "Improve the house", hint: "+6 house reputation", price: "35", disabled: state.coin < 35, reason: "Need 35 coin", action: () => Game.improveHouse() }
      ]);
    }

    const money = UI.panel(v, "Money", "",
      `<div class="kv">
        <span>Coin</span><span style="color:var(--c-coin)">${state.coin}</span>
        <span>Debt</span><span style="color:${state.debt ? "var(--bad)" : "inherit"}">${state.debt}${state.debt ? ` · ${state.debtDays}d overdue` : ""}</span>
        ${state.debt ? `<span>Interest</span><span>5% daily</span>` : ""}
        <span>Daily upkeep</span><span>${Game.upkeep()}</span>
        ${ctx === "brothel" ? `<span>House cut</span><span>${Math.round(state.houseCut * 100)}%</span>` : ""}
        ${ctx === "manager" && state.staff ? `<span>Staff wages</span><span>${Game.wages()}/day</span>` : ""}
      </div>`);
    if (state.debt) UI.addChoices(money, [{ label: "Pay down debt", hint: `Pay up to ${Math.min(state.coin, state.debt)}`, disabled: state.coin < 1, reason: "No coin", action: () => Game.payDebt() }]);

    if (ctx === "manager") {
      const list = state.staffMembers.map(m => `<div class="staff"><div class="top"><span>${m.name}</span><span style="color:var(--mute)">${m.loyalty < 25 ? "⚠ restless" : ""}</span></div>
        ${UI.bar("Skill", m.skill, 100, "var(--gold)")}${UI.bar("Loyalty", m.loyalty, 100, m.loyalty < 25 ? "var(--bad)" : "var(--c-control)")}</div>`).join("");
      const p = UI.panel(v, "Staff", "Paid daily. Unpaid or neglected staff steal or walk out.", list || `<div class="empty">No staff yet.</div>`);
      const treatCost = state.staff * 6;
      UI.addChoices(p, [
        { label: "Hire a worker", hint: "Skill 25–49, starts fairly loyal", price: "45", disabled: state.coin < 45, reason: "Need 45 coin", action: () => Game.hireStaff() },
        { label: "Treat your staff", hint: "+8 loyalty each · once a day", price: treatCost ? String(treatCost) : "", disabled: !state.staff || state.coin < treatCost || state.flags.treatedDay === state.day, reason: !state.staff ? "No staff" : state.flags.treatedDay === state.day ? "Already treated today" : `Need ${treatCost} coin`, action: () => Game.treatStaff() }
      ]);
    }

    const rels = NPCS.filter(n => state.relationships[n.id]);
    UI.panel(v, "People", "Regulars remember you. Some of them want more than an hour.",
      rels.length ? rels.map(n => {
        const r = rel(n.id);
        return `<div class="staff"><div class="top"><span>${n.name}</span><span style="color:var(--mute);font-size:.8rem">${n.blurb}</span></div>
          ${UI.bar("Affection", r.love, 20, "var(--c-rep)")}${UI.bar("Trust", r.trust, 20, "var(--c-control)")}</div>`;
      }).join("") : `<div class="empty">No one has made an impression yet.</div>`);
  },

  viewMarket(v) {
    const p = UI.panel(v, "The market", "Spend coin to work better, earn more, or recover faster.");
    UI.addChoices(p, MARKET.filter(i => !i.stage || i.stage === state.stage || state.upgrades[i.id]).map(i => {
      const owned = i.once && state.upgrades[i.id];
      return {
        label: i.name + (owned ? " ✓" : ""),
        hint: owned ? "Owned" : i.desc,
        price: owned ? "" : String(priceOf(i)),
        disabled: owned || state.coin < priceOf(i),
        reason: owned ? "Owned" : `Need ${priceOf(i)} coin`,
        action: () => Game.buy(i)
      };
    }));
  },

  viewJournal(v) {
    const s = state.stats;
    const types = Object.keys(s.byType).filter(k => s.byType[k] > 0).map(k => `<span>${SKILL_LABEL[k] || k}</span><span>${s.byType[k]}</span>`).join("");
    UI.panel(v, "Ledger", "",
      `<div class="kv">
        <span>Days</span><span>${s.daysPlayed}</span>
        <span>Clients served</span><span>${s.bodyCount}</span>
        <span>Satisfied / unsatisfied</span><span>${s.successes} / ${s.failures}</span>
        <span>Trouble survived</span><span>${s.troubles}</span>
        <span>Coin earned</span><span>${s.coinEarned}</span>
        ${types}
      </div>`);
    const np = UI.panel(v, "Settings", "");
    const full = (state.settings || {}).narration !== "brief";
    UI.addChoices(np, [{ label: `Encounter narration: ${full ? "Full" : "Brief"}`, hint: full ? "Descriptive lines every turn · tap for short mechanical text" : "Short mechanical text · tap for descriptive lines", disabled: !Narrator.data(), reason: "narration.js not found", action: () => { state.settings = { ...(state.settings || {}), narration: full ? "brief" : "full" }; UI.renderView(); } }]);
    const p = UI.panel(v, "Save", "The game also saves itself at every dawn.");
    UI.addChoices(p, [
      { label: "Save game", action: () => Game.save(true) },
      { label: "Load game", disabled: !Game.hasSave(), reason: "No save yet", action: () => Game.load() },
      { label: Game.confirmNew ? "Tap again to abandon this life" : "Start a new life", danger: true, action: () => { if (Game.confirmNew) { Game.confirmNew = false; Game.newGame(); } else { Game.confirmNew = true; setTimeout(() => { Game.confirmNew = false; }, 4000); } } }
    ]);
    UI.panel(v, "Journal", "Most recent first.",
      state.journal.length ? state.journal.map(e => `<div class="entry ${e.k === "roll" ? "roll-entry" : ""}"><div class="when">Day ${e.d} · ${e.p}</div>${e.t}</div>`).join("") : `<div class="empty">Nothing written yet.</div>`);
  }
};

/* =========================================================
   NARRATOR — reads lines from narration.js (window.NARRATION)
   ========================================================= */
const NPC_GENDER = { marlow: "male", edric: "male", briar: "female" };
const CLIENT_PRONOUNS = {
  male: { they: "he", them: "him", their: "his", themself: "himself", s: "s", es: "es", are: "is" },
  female: { they: "she", them: "her", their: "her", themself: "herself", s: "s", es: "es", are: "is" },
  they: { they: "they", them: "them", their: "their", themself: "themself", s: "", es: "", are: "are" }
};
const Narrator = {
  used: {},
  data() { return typeof window !== "undefined" && window.NARRATION && typeof window.NARRATION === "object" ? window.NARRATION : null; },
  on() { return !!this.data() && (state.settings || {}).narration !== "brief"; },
  pick(key, list) {
    if (!Array.isArray(list) || !list.length) return null;
    let used = this.used[key] || [];
    let idx = list.map((_, i) => i).filter(i => !used.includes(i));
    if (!idx.length) { used = []; idx = list.map((_, i) => i); }
    const i = pick(idx);
    used.push(i);
    this.used[key] = used;
    return list[i];
  },
  fill(line, e) {
    if (!line) return "";
    const pr = CLIENT_PRONOUNS[e.cg] || CLIENT_PRONOUNS.male;
    const client = e.npc ? e.npc.name : e.patron ? "the patron" : "your client";
    const map = { name: esc(state.character.name || ""), client, move: (e.curMove || e.item).name, ...pr };
    return line.replace(/\{(\w+)\}/g, (m, k) => {
      const lower = k.charAt(0).toLowerCase() + k.slice(1);
      const v = map[k] !== undefined ? map[k] : map[lower];
      if (v === undefined) return m;
      return k !== lower ? cap(String(v)) : String(v);
    });
  },
  // Lines may be strings or { t, not: [tags] }; skip lines that clash with the current pose's tags.
  line(key, list, e) {
    if (!Array.isArray(list)) return "";
    const tech = ((this.data() || {}).techniques || {})[(e.curMove || e.item).id] || {};
    const tags = tech.tags || [];
    const ok = list.filter(x => typeof x === "string" || !(x.not || []).some(t => tags.includes(t)));
    const chosen = this.pick(key + "|" + tags.join(","), ok);
    return this.fill(chosen && typeof chosen === "object" ? chosen.t : chosen, e);
  },
  band(e) {
    const pct = 1 - Math.max(0, e.climax) / e.climaxMax;
    return pct < 0.3 ? "low" : pct < 0.7 ? "mid" : "high";
  },
  open(e) {
    const N = this.data();
    const parts = [this.line("open:" + e.ctx, (N.open || {})[e.ctx], e)];
    if (e.revealed) parts.push(this.line("temp:" + e.typeKey, (N.temperament || {})[e.typeKey], e));
    const t = (N.techniques || {})[e.item.id];
    if (t) parts.push(this.line("start:" + e.item.id, t.start, e));
    return parts.filter(Boolean).join(" ");
  },
  turn(e, o) {
    const N = this.data();
    const res = o.success ? "success" : "fail";
    const parts = [];
    const tech = (N.techniques || {})[o.pos.id] || {};
    const sk = (N.skills || {})[o.pos.skill] || {};
    const def = (N.skills || {})._default || {};
    if ((o.kind === "work" || o.kind === "focus") && o.switched && tech.start) parts.push(this.line("start:" + o.pos.id, tech.start, e));
    const ap = (N.approaches || {})[o.kind] || {};
    const own = () => this.line(`${o.pos.id}:${res}`, tech[res], e) || this.line(`sk:${o.pos.skill}:${res}`, sk[res], e) || this.line(`def:${res}`, def[res], e);
    let main = null;
    if ((o.kind === "work" || o.kind === "focus") && o.repeat) main = this.line(`rep:${o.pos.id}`, tech.repeat || sk.repeat || def.repeat, e);
    else if (o.kind === "focus") main = (o.success ? this.line(`focus:${o.pos.id}`, tech.focus, e) : null) || this.line(`ap:focus:${res}`, ap[res], e) || own();
    else if (o.kind !== "work") main = this.line(`ap:${o.kind}:${res}`, ap[res], e) || own();
    else main = own();
    const isTech = o.kind === "work" || o.kind === "focus";
    if (isTech && !o.repeat && o.success && o.disliked) main = this.line("disliked", N.disliked, e) || main;
    if (main) parts.push(main);
    if (isTech && !o.repeat && o.success && o.liked) parts.push(this.line("liked", N.liked, e));
    const band = this.band(e);
    const rb = (N.reactions || {})[band];
    parts.push(this.line(`react:${band}:${res}`, Array.isArray(rb) ? rb : (rb || {})[res], e));
    return parts.filter(Boolean).join(" ");
  },
  finish(e, success) {
    const N = this.data();
    const k = success ? "success" : "fail";
    return this.line("fin:" + k, (N.finish || {})[k], e);
  }
};

/* =========================================================
   GAME
   ========================================================= */
const Game = {
  mode: "creation",
  lastRoll: null,
  confirmNew: false,

  log(text, kind = "") {
    state.journal.unshift({ d: state.day, p: state.phase, t: text, k: kind });
    if (state.journal.length > 150) state.journal.length = 150;
  },
  setMode(m) { this.mode = m; UI.setTabsLocked(m !== "menu"); },

  outcome(title, body, next, opts = {}) {
    this.setMode(opts.mode || "event");
    UI.scene({ kicker: opts.kicker || "", title, body, roll: opts.roll || null, chips: opts.chips });
    UI.choices([{ label: opts.cta || "Continue", primary: true, action: next || (() => this.menu()) }]);
  },

  /* ---------- Main menu ---------- */
  menu() {
    if (UI.tab !== "work") { UI.showTab("work"); return; }
    UI.renderHUD();
    this.lastRoll = null;
    if (this.checkForcedEnding()) return;
    if (state.pendingLevelUps > 0) { state.pendingLevelUps--; this.offerLevelUp(); return; }
    if (state.stress >= 100) { this.breakdown(); return; }
    if (this.checkStory()) return;

    this.setMode("menu");
    const ctx = contextOf();
    const cfg = STAGE_CONFIG[state.stage];
    const lines = [STAGE_BLURB[state.stage][state.phase]];
    const why = whyCantWork(ctx);
    if (why) lines.push(`\n<em>${why}</em>`);
    const chips = [];
    if (state.phaseMods.label) chips.push({ text: state.phaseMods.label, cls: state.phaseMods.payMult >= 1 ? "gold" : "warn" });
    if (state.debt) chips.push({ text: `Debt ${state.debt}${state.debtDays >= 2 ? " · creditors circling" : ""}`, cls: "warn" });
    if (ctx === "brothel") chips.push({ text: `House cut ${Math.round(state.houseCut * 100)}%` });
    if (state.health < lowHealthLimit()) chips.push({ text: "Injured: disadvantage", cls: "warn" });
    if (state.stress >= 75) chips.push({ text: "Near breaking point", cls: "warn" });
    if (state.trauma >= 60) chips.push({ text: `Trauma ${state.trauma} — seek sanctuary`, cls: "warn" });
    UI.scene({ kicker: `Day ${state.day} · ${cfg.label}`, title: `${cap(state.phase)} in ${cfg.place}`, body: lines.join("\n"), chips });

    const choices = [];
    if (this.canAdvance()) choices.push({ label: `Rise to ${STAGE_CONFIG[state.stage === "street" ? "brothel" : "manager"].label}`, hint: "You've met every requirement", primary: true, action: () => this.advanceStage() });
    if (state.coin >= retireAt() && !state.debt) choices.push({ label: "Retire from the life", hint: "End the game with your savings", primary: true, action: () => this.ending("wealthy") });
    if (ctx === "manager" && state.houseReputation >= 60) choices.push({ label: "Claim the city's finest house", hint: "End the game at the top", primary: true, action: () => this.ending("house") });

    const left = clientCap(ctx) - state.flags.clientsThisPhase;
    const workLabel = { street: "Look for a client", brothel: "Take a parlor client", manager: "Receive a special client" }[ctx];
    choices.push({ label: workLabel, hint: `${left} more this ${state.phase} · base pay ~${Math.floor(grossPay(ctx, INDEX.positions[0], false) * netFactor(ctx))}`, disabled: !!why, reason: why, action: () => this.startEncounter(ctx) });

    if (ctx === "manager") {
      choices.push({ label: "Put your staff to work", hint: state.staff ? `Income from ${state.staff} worker${state.staff > 1 ? "s" : ""} · once per phase` : "Hire staff in the House tab", disabled: !state.staff || state.flags.assignedThisPhase, reason: !state.staff ? "No staff yet — hire in the House tab" : "Already working this phase", action: () => this.assignStaff() });
    }
    if (ctx === "brothel" && !state.story.cutDeal) {
      const dc = 13 + controlMod();
      const meta = skillMeta("persuasion");
      const ok = state.control >= 70 && state.flags.cutTriedDay !== state.day;
      choices.push({ label: "Bargain with Madam Briar over your cut", hint: "Persuasion · success halves the house cut", odds: ok ? odds(meta, dc) : undefined, disabled: !ok, reason: state.control < 70 ? "Needs Control 70+" : "Already tried today", action: () => this.bargainCut(dc) });
    }
    choices.push({ label: "Rest", hint: state.flags.clientsThisPhase ? "A fair recovery after work" : "Light rest — you haven't worked", disabled: state.flags.restedThisPhase, reason: "Already rested this phase", action: () => this.rest() });
    if (state.debt) choices.push({ label: "Pay down debt", hint: `Owed ${state.debt} · 5% interest daily`, disabled: state.coin < 1, reason: "No coin", action: () => this.payDebt() });
    choices.push({ label: PHASE_END[state.phase], hint: state.phase === "night" ? `Upkeep ${this.upkeep()}${ctx === "manager" && state.staff ? ` + wages ${this.wages()}` : ""} due at dawn` : "", quiet: true, action: () => this.endPhase() });
    UI.choices(choices);
  },

  refresh() { if (UI.tab === "work") this.menu(); else UI.renderView(); },

  canAdvance() {
    const r = STAGE_CONFIG[state.stage].advance;
    return !!r && !state.debt && state.coin >= r.coin && state.reputation >= r.reputation && state.clientsServed >= r.clients;
  },

  advanceStage() {
    state.stage = state.stage === "street" ? "brothel" : "manager";
    const ambition = state.stage === "manager" && state.character.motivation === "ambition";
    if (ambition) state.houseReputation += 10;
    const notes = {
      brothel: "Madam Briar gives you a room upstairs. Clients are steadier and pay more, but the house takes its cut.",
      manager: "You take the office and the keys. Now you hire, pay and keep your own people — and the house's name is yours to make."
    };
    this.log(`Rose to ${STAGE_CONFIG[state.stage].label}.`);
    this.outcome(STAGE_CONFIG[state.stage].label, notes[state.stage] + (ambition ? "\n\n<em>This is what you came for. +10 house reputation.</em>" : ""), null, { kicker: "A new chapter" });
  },

  offerLevelUp() {
    this.setMode("event");
    UI.scene({ kicker: "Level up", title: `Level ${state.level}`, body: `Choose an attribute to improve.${state.pendingLevelUps ? `\n<em>${state.pendingLevelUps} more after this.</em>` : ""}` });
    UI.choices(["str", "dex", "con", "wis", "cha"].map(a => ({
      label: `${a.toUpperCase()} ${state.attributes[a]} → ${Math.min(20, state.attributes[a] + 1)}`,
      hint: ATTR_USE[a],
      disabled: state.attributes[a] >= 20, reason: "Maxed",
      action: () => {
        state.attributes[a] = Math.min(20, state.attributes[a] + 1);
        this.log(`${a.toUpperCase()} rose to ${state.attributes[a]}.`);
        this.menu();
      }
    })));
  },

  /* ---------- Encounters ---------- */
  startEncounter(ctx) {
    const why = whyCantWork(ctx);
    if (why) { UI.toast(why); this.menu(); return; }
    state.flags.clientsThisPhase++;
    this.setMode("encounter");

    const useKink = Math.random() > 0.5;
    let pool = useKink ? INDEX.kinks : INDEX.positions.filter(p => state.knownPositions.includes(p.id));
    if (state.level < 3) pool = pool.filter(x => x.risk <= 2);
    if (!pool.length) pool = [INDEX.positions[0]];
    const prefs = (() => {
      const all = [...INDEX.positions, ...INDEX.kinks].map(x => x.id).sort(() => Math.random() - 0.5);
      return { likes: all.slice(0, 2), dislikes: all.slice(2, 4) };
    })();
    let item = pick(pool);
    const likedInPool = pool.find(x => prefs.likes.includes(x.id));
    if (likedInPool && Math.random() < 0.55) item = likedInPool;
    prefs.dislikes = prefs.dislikes.filter(id => id !== item.id || Math.random() < 0.5);

    const fameIdx = getFameIndex();
    const patron = fameIdx >= 2 && Math.random() < 0.1 + 0.03 * (fameIdx - 2);
    let type = rollClientType();
    if (patron) type = Math.random() < 0.5 ? CLIENT_TYPES.generous : CLIENT_TYPES.demanding;
    const npc = !patron && Math.random() < 0.4 ? pick(NPCS) : null;

    let dc = 8 + item.risk * 2 + (ctx === "street" ? 1 : 0) + Math.max(0, state.level - 2) + Math.floor(Math.random() * 3);
    if (prefs.likes.includes(item.id)) dc -= 1;
    if (prefs.dislikes.includes(item.id)) dc += 2;

    this.offer = {
      item, ctx, prefs, type, patron, npc,
      cg: npc ? NPC_GENDER[npc.id] : (Math.random() < 0.7 ? "male" : "female"),
      baseDC: dc,
      gross: grossPay(ctx, item, patron),
      stress: ctx === "street" ? 5 : 3,
      revealed: false, readTried: false
    };
    this.log(`${npc ? npc.name : patron ? "A wealthy patron" : "A stranger"} asked for ${item.name}.`);
    this.showOffer();
  },

  showOffer() {
    const o = this.offer;
    const net = g => Math.floor(g * netFactor(o.ctx));
    const realDC = o.baseDC + o.type.dc;
    const shownDC = o.revealed ? realDC : o.baseDC;
    const liked = o.prefs.likes.includes(o.item.id), disliked = o.prefs.dislikes.includes(o.item.id);
    const who = o.npc ? o.npc.name : o.patron ? "A wealthy patron" : "A stranger";
    const lines = [];
    if (o.npc) lines.push(`<em>${cap(o.npc.blurb)}.</em>`);
    if (o.patron) lines.push(`<em>Fine wool, a heavy ring, a servant waiting outside. Your name has reached the right ears.</em>`);
    lines.push(`They want <b>${o.item.name}</b>. ${liked ? "It's something they love." : disliked ? "Oddly, it's something they usually dislike." : ""}`);
    lines.push(o.revealed ? `\nYou read them: <b>${o.type.name}</b>. ${o.type.desc}` : o.readTried ? "\nYou couldn't get a read on them." : "\nYou haven't sized them up yet.");
    const chips = [];
    o.prefs.likes.forEach(id => chips.push({ text: "♥ " + nameOf(id), cls: "like" }));
    o.prefs.dislikes.forEach(id => chips.push({ text: "✕ " + nameOf(id), cls: "dislike" }));
    if (o.revealed) chips.push({ text: o.type.name, cls: o.type.key === "dangerous" ? "warn" : o.type.key === "generous" ? "gold" : "calm" });
    UI.scene({ kicker: "A client approaches", title: who, body: lines.join("\n"), chips, roll: this.lastRoll });

    const meta = skillMeta(o.item.skill);
    const accOdds = odds(meta, o.revealed ? realDC : shownDC);
    const ch = [];
    if (!o.readTried) {
      const rdc = o.type.key === "dangerous" ? 13 : 11;
      ch.push({ label: "Size them up", hint: "Insight · reveals what kind of client this is", odds: odds(skillMeta("insight", { bonus: state.classFeatures.keenEye ? 2 : 0 }), rdc), action: () => {
        o.readTried = true;
        const r = check(skillMeta("insight", { bonus: state.classFeatures.keenEye ? 2 : 0 }), rdc);
        if (r.success) o.revealed = true;
        this.showOffer();
      } });
    }
    ch.push({ section: "Terms" });
    ch.push({ label: `Accept`, hint: `~${net(o.gross)} coin · stress +${o.stress} · ${meta.label} per round${o.revealed ? "" : " · odds before reading"}`, odds: accOdds, primary: true,
      action: () => this.beginEncounter({ dc: realDC, gross: o.gross, stress: o.stress }) });
    if (state.control >= 60) {
      ch.push({ label: "Name your price", hint: `~${net(Math.round(o.gross * 1.3))} coin · harder to please · Control 60+`, odds: odds(meta, (o.revealed ? realDC : shownDC) + 1),
        action: () => this.beginEncounter({ dc: realDC + 1, gross: Math.round(o.gross * 1.3), stress: o.stress + 1 }) });
    }
    const pm = skillMeta("persuasion");
    ch.push({ label: "Negotiate gentler terms", hint: `~${net(Math.floor(o.gross * 0.65))} coin · success: easier and calmer`, odds: odds(pm, realDC), action: () => {
      const r = check(pm, realDC);
      const g = Math.floor(o.gross * 0.65);
      if (r.success) this.beginEncounter({ dc: realDC - 2, gross: g, stress: 2, note: "They agree to gentler terms." });
      else this.beginEncounter({ dc: realDC, gross: g, stress: o.stress, note: "They take the lower price but won't budge on anything else." });
    } });
    if (state.classFeatures.command && isKink(o.item.id)) {
      ch.push({ label: "Command the scene", hint: `~${net(o.gross + 6)} coin · Dominatrix · more stress`, odds: odds(meta, realDC + 1), action: () => this.beginEncounter({ dc: realDC + 1, gross: o.gross + 6, stress: o.stress + 2 }) });
    }
    if (state.inspiration) {
      ch.push({ label: "Accept, inspired", hint: `~${net(o.gross + 4)} coin · advantage on the first round · spends Inspiration`, odds: chanceOf(meta.bonus, realDC, true, meta.dis), action: () => this.beginEncounter({ dc: realDC, gross: o.gross + 4, stress: Math.max(1, o.stress - 2), inspiration: true }) });
    }
    const free = state.control >= 60;
    ch.push({ label: "Turn them away", hint: free ? "On your own terms · no penalty (Control 60+)" : "−1 reputation · −2 control", quiet: true, action: () => {
      if (!free) { state.reputation = Math.max(0, state.reputation - 1); state.control = Math.max(0, state.control - 2); }
      if (o.npc) adjustRel(o.npc.id, { trust: -2 });
      this.log(`Turned away ${who}.`);
      this.menu();
    } });
    UI.choices(ch);
  },

  beginEncounter(t) {
    const o = this.offer;
    this.lastRoll = this.lastRoll && t.note ? this.lastRoll : null;
    const liked = o.prefs.likes.includes(o.item.id), disliked = o.prefs.dislikes.includes(o.item.id);
    let max = 12 + o.item.risk * 4 + (o.ctx === "manager" ? 4 : 0) + o.type.climax;
    if (liked) max = Math.max(8, max - 4);
    if (disliked) max += 5;
    let adv = 0;
    if (t.inspiration && state.inspiration) { state.inspiration = 0; adv = 1; }
    state.stress = clamp(state.stress + t.stress, 0, 100);
    state.encounter = {
      item: o.item, skill: o.item.skill, ctx: o.ctx, prefs: o.prefs, type: o.type, typeKey: o.type.key, revealed: o.revealed,
      patron: o.patron, npc: o.npc, cg: o.cg, curMove: o.item, dc: t.dc, gross: t.gross,
      climax: max, climaxMax: max, round: 1, maxRounds: 5,
      advantageRounds: adv, lastMoveId: null, repeat: 0, combo: 0,
      text: t.note || "You lead them to somewhere private."
    };
    this.offer = null;
    const en = state.encounter;
    if (Narrator.on()) en.text = (t.note ? t.note + " " : "") + Narrator.open(en);
    this.encounterRound();
  },

  planAction(kind, pos) {
    const e = state.encounter;
    const p = { kind, pos, skill: pos.skill, dcMod: 0, dmg: 3 + (pos.risk || 1), stress: 2, energy: 6, moveId: pos.id };
    if (kind === "tease") { Object.assign(p, { skill: "performance", dcMod: -2, dmg: 2, stress: 1, moveId: "tease" }); }
    else if (kind === "focus") { Object.assign(p, { dcMod: 2, dmg: 4 + (pos.risk || 1), stress: 3, energy: 8 }); }
    else if (kind === "recover") { Object.assign(p, { skill: "insight", dcMod: -1, dmg: 1, stress: state.classFeatures.soothing ? -4 : -2, energy: 3, moveId: "recover" }); }
    else if (kind === "command") { Object.assign(p, { skill: "kink", dcMod: 1, dmg: 4 + (pos.risk || 1), stress: 2, moveId: "command" }); }
    else {
      const preferred = [...(CLASS_POSITIONS[state.character.class] || []), ...(SUBCLASS_POSITIONS[state.character.subclass] || [])];
      if (preferred.includes(pos.id)) p.dmg += 1;
    }
    if (state.classFeatures.frail) p.energy += 2;
    if (state.classFeatures.ironHips && p.skill === "vaginal") p.energy = Math.max(2, p.energy - 2);
    if (state.classFeatures.slender && (p.skill === "oral" || p.skill === "manual")) p.energy = Math.max(2, p.energy - 1);
    p.repeat = kind !== "recover" && p.moveId === e.lastMoveId ? e.repeat + 1 : 0;
    if (p.repeat) p.dmg = Math.max(1, p.dmg - 2 * p.repeat);
    p.dc = Math.max(6, e.dc + p.dcMod);
    p.meta = skillMeta(p.skill, { advantage: e.advantageRounds > 0 });
    p.odds = odds(p.meta, p.dc);
    return p;
  },

  encounterRound() {
    const e = state.encounter;
    if (!e) { this.menu(); return; }
    if (e.climax <= 0) { this.finishEncounter(true); return; }
    if (e.round > e.maxRounds || state.energy < 6) { this.finishEncounter(false); return; }

    const pct = Math.round((1 - Math.max(0, e.climax) / e.climaxMax) * 100);
    const mood = pct < 30 ? "still guarded" : pct < 70 ? "warming to you" : "nearly there";
    const chips = [];
    if (e.combo > 1) chips.push({ text: `Rhythm ×${e.combo}`, cls: "gold" });
    if (e.lastMoveId && e.repeat) chips.push({ text: "Getting repetitive", cls: "warn" });
    if (e.advantageRounds) chips.push({ text: "Inspired: advantage", cls: "gold" });
    e.prefs.likes.forEach(id => chips.push({ text: "♥ " + nameOf(id), cls: "like" }));
    UI.scene({
      kicker: `Round ${e.round} of ${e.maxRounds} · ${e.item.name}`,
      title: e.npc ? e.npc.name : e.patron ? "A wealthy patron" : "Your client",
      body: Narrator.on() ? e.text : `${e.text}\n<em>They are ${mood}.</em>`,
      meter: { label: "Satisfaction", value: pct, pips: { max: e.maxRounds, used: e.round - 1 } },
      roll: this.lastRoll, chips
    });

    const opt = (kind, pos, label, extra) => {
      const p = this.planAction(kind, pos);
      const notes = [];
      if (extra) notes.push(extra);
      if (p.repeat) notes.push("repeating — weaker");
      if (kind === "work" || kind === "focus") {
        if (e.prefs.likes.includes(pos.id)) notes.push("they love this");
        else if (e.prefs.dislikes.includes(pos.id)) notes.push("they dislike this");
      }
      notes.push(`${p.meta.label} · −${p.energy} energy`);
      return { label, hint: notes.join(" · "), odds: p.odds, disabled: state.energy < p.energy, reason: "Not enough energy", action: () => this.doRound(kind, pos) };
    };

    const list = [opt("work", e.item, `${e.item.name}`, "what they asked for")];
    list[0].primary = true;
    const tech = state.knownPositions.filter(id => isPosition(id) && id !== e.item.id).map(id => {
      const p = getPosition(id);
      const o = opt("work", p, p.name);
      o.hint = o.hint.replace(/ · −\d+ energy$/, "");
      return o;
    });
    if (tech.length) list.push({ section: "Switch technique" }, { grid: tech });
    list.push({ section: "Approach" });
    list.push(opt("focus", e.item, "Push harder", "big progress, harder"));
    list.push(opt("tease", e.item, "Tease and talk", "safe, slow"));
    list.push(opt("recover", e.item, "Pull back and breathe", "eases your stress"));
    if (state.classFeatures.command) list.push(opt("command", e.item, "Take command", "Dominatrix"));
    list.push({ label: "End it early", hint: "They leave unsatisfied", quiet: true, danger: true, action: () => this.finishEncounter(false) });
    UI.choices(list);
  },

  doRound(kind, pos) {
    const e = state.encounter;
    if (!e) { this.menu(); return; }
    const p = this.planAction(kind, pos);
    if (state.energy < p.energy) { e.text = "You're too spent to go on."; this.finishEncounter(false); return; }
    state.energy -= p.energy;
    if (e.advantageRounds > 0) e.advantageRounds--;
    const r = check(p.meta, p.dc);
    let stress = p.stress;
    const verb = { tease: "You tease them with words and a slow touch.", focus: `You throw yourself into ${pos.name}.`, recover: "You slow down and steady yourself.", command: "You take control of the pace." }[kind] || `You move into ${pos.name}.`;
    let text = verb;
    const isTech = kind === "work" || kind === "focus";
    const liked = isTech && e.prefs.likes.includes(pos.id), disliked = isTech && e.prefs.dislikes.includes(pos.id);
    const switched = isTech && e.curMove && e.curMove.id !== pos.id;
    if (isTech) e.curMove = pos;

    if (r.success) {
      let dealt = p.dmg + Math.max(0, Math.floor((r.total - p.dc) / 3));
      if ((kind === "work" || kind === "focus") && e.prefs.likes.includes(pos.id)) { dealt += 2; text += " They love it."; }
      else if ((kind === "work" || kind === "focus") && e.prefs.dislikes.includes(pos.id)) { dealt = Math.max(1, dealt - 2); text += " They tolerate it, barely."; }
      if (p.moveId !== e.lastMoveId && kind !== "recover") e.combo = Math.min(3, e.combo + 1);
      const combo = Math.max(0, e.combo - 1);
      dealt += combo;
      if (p.repeat) text += " It's losing its effect.";
      else if (combo) text += " You've found a rhythm.";
      else text += " It lands.";
      e.climax -= dealt;
      if (state.classFeatures.thickSkinned) stress = Math.max(stress < 0 ? stress : 0, stress - 1);
    } else {
      e.climax -= 1;
      e.combo = 0;
      stress += state.classFeatures.nervous ? 3 : 2;
      state.control = Math.max(0, state.control - 1);
      text += p.repeat ? " They've had enough of that." : " It doesn't land. You strain to recover.";
    }
    if (stress > 0) stress += Math.floor(state.trauma / 25);
    state.stress = clamp(state.stress + stress, 0, 100);
    e.repeat = p.repeat;
    e.lastMoveId = p.moveId;
    e.round++;
    e.text = Narrator.on() ? Narrator.turn(e, { kind, pos, success: r.success, repeat: p.repeat, liked, disliked, switched }) : text;
    if (state.stress >= 100) { e.text += " Something in you gives way. You can't go on."; this.finishEncounter(false); return; }
    this.encounterRound();
  },

  finishEncounter(success) {
    const e = state.encounter;
    state.encounter = null;
    if (!e) { this.menu(); return; }
    const risk = e.item.risk || 1;
    let gross = success ? (e.gross + 4 + risk * 2) * e.type.payMult : e.gross * 0.45;
    const tip = success && e.type.tip ? Math.floor(gross * e.type.tip) : 0;
    const coin = Math.max(2, Math.floor((gross + tip) * netFactor(e.ctx)));
    const r = { success, coin, tip, notes: [] };

    let chance = { street: 0.06, brothel: 0.03, manager: 0.02 }[e.ctx] + e.type.trouble + (state.phaseMods.trouble || 0);
    if (getFameIndex() >= 3) chance += 0.03;
    if (state.upgrades.corner && e.ctx === "street") chance -= 0.03;
    if (state.classFeatures.streetSmart) chance -= 0.03;
    if (state.classFeatures.marked) chance += 0.04;
    if (Math.random() < chance) { this.trouble(e, r); return; }
    this.applyResult(e, r);
  },

  trouble(e, r) {
    this.setMode("event");
    state.stats.troubles++;
    const rough = Math.random() < (e.typeKey === "dangerous" ? 0.7 : 0.4);
    const dcShift = controlMod() ;
    const extra = { bonus: state.upgrades.bodyguard ? 2 : 0 };
    const house = e.ctx !== "street";
    const who = e.npc ? e.npc.name : "The client";
    this.log(rough ? `${who} turned rough.` : `${who} refused to pay.`);
    const after = (text, roll) => this.applyResult(e, r, text, roll);

    if (!rough) {
      UI.scene({ kicker: "Trouble", title: "They won't pay", body: `${who} straightens their clothes, smiles, and heads for the door without settling up.`, chips: [{ text: `Owed ${r.coin}`, cls: "warn" }] });
      const pm = skillMeta("persuasion", extra), dc = 12 + dcShift;
      UI.choices([
        { label: "Demand your money", hint: "Persuasion", odds: odds(pm, dc), action: () => {
          const c = check(pm, dc);
          if (c.success) after("You block the door and name the sum. They pay, sullenly.", c);
          else { r.coin = 0; state.stress = clamp(state.stress + 6, 0, 100); state.control = Math.max(0, state.control - 3); after("They laugh and shoulder past you. The money is gone.", c); }
        } },
        house ? { label: "Call the house", hint: "The bouncer collects · 25% fee", action: () => { r.coin = Math.floor(r.coin * 0.75); after("A word to the door and the matter is settled — for a fee."); } } : null,
        { label: "Let it go", hint: "No pay · −5 control", quiet: true, action: () => { r.coin = 0; state.control = Math.max(0, state.control - 5); after("You let them go. It isn't worth the risk."); } }
      ]);
    } else {
      UI.scene({ kicker: "Trouble", title: "It turns rough", body: `${who}'s grip tightens and their mood sours. This is no longer a game to them.`, chips: [{ text: "Danger", cls: "warn" }] });
      const hurt = text => { state.health = Math.max(0, state.health - 15); state.trauma = Math.min(100, state.trauma + (state.classFeatures.resilientMind ? 3 : 4)); state.stress = clamp(state.stress + 10, 0, 100); r.coin = Math.floor(r.coin / 2); return text; };
      const sm = attrMeta("str", extra), sdc = 13 + dcShift;
      const pm = skillMeta("persuasion", extra), pdc = 14 + dcShift;
      UI.choices([
        { label: "Break free", hint: "STR · fail: hurt, lose half pay", odds: odds(sm, sdc), action: () => {
          const c = check(sm, sdc);
          if (c.success) { state.stress = clamp(state.stress + 4, 0, 100); after("You twist free and put the table between you. They think better of it and pay.", c); }
          else after(hurt("You can't get loose in time. It ends badly."), c);
        } },
        { label: "Talk them down", hint: "Persuasion · fail: hurt, lose half pay", odds: odds(pm, pdc), action: () => {
          const c = check(pm, pdc);
          if (c.success) { state.stress = clamp(state.stress + 3, 0, 100); after("Your voice stays level. The fire goes out of them.", c); }
          else after(hurt("Your words only make it worse."), c);
        } },
        house ? { label: "Shout for the house", hint: "Safe · 25% fee", action: () => { state.health = Math.max(0, state.health - 3); r.coin = Math.floor(r.coin * 0.75); after("Boots on the stairs. The client is thrown out — after paying, minus the bouncer's share."); } } : null,
        { label: "Endure it", hint: "Keep your pay · −10 health · +3 trauma", quiet: true, action: () => { state.health = Math.max(0, state.health - 10); state.trauma = Math.min(100, state.trauma + 3); after("You wait for it to be over. It eventually is."); } }
      ]);
    }
  },

  applyResult(e, r, troubleText, troubleRoll) {
    const risk = e.item.risk || 1;
    const lines = [];
    if (troubleText) lines.push(troubleText);
    let rep = e.ctx === "street" ? 2 : 3;
    let trauma = 0;
    if (r.success) {
      rep += 1;
      if (state.classFeatures.naturalCharm) rep += 1;
      state.fame += e.patron ? 6 : 3;
      let cg = 3 + getMod(state.attributes.cha);
      if (state.classFeatures.cravesIntensity && !isKink(e.item.id)) cg = Math.floor(cg / 2);
      state.control = clamp(state.control + cg, 0, 100);
      if (e.prefs.likes.includes(e.item.id) && !state.inspiration) { state.inspiration = 1; lines.push("They were delighted. You feel inspired."); }
    } else {
      trauma = state.classFeatures.resilientMind ? Math.max(0, risk - 1) : risk;
      if (state.classFeatures.haunted) trauma += 1;
      state.control = Math.max(0, state.control - 5);
      state.health = Math.max(0, state.health - risk * 3);
      state.fame += 1;
    }
    if (state.classFeatures.badRep) rep = Math.max(0, rep - 1);
    state.coin += r.coin;
    state.reputation += rep;
    state.trauma = Math.min(100, state.trauma + trauma);
    state.stats.coinEarned += r.coin;
    state.stats.encounters++;
    if (r.success) state.stats.successes++; else state.stats.failures++;
    const kind = e.item.skill || "performance";
    state.stats.byType[kind] = (state.stats.byType[kind] || 0) + 1;
    state.skills[kind] = Math.min(100, (state.skills[kind] || 0) + (r.success ? 4 : 1));
    if (r.success && learnPosition(e.item.id)) lines.push(`You've learned ${e.item.name}.`);
    state.clientsServed++;
    state.stats.bodyCount = state.clientsServed;
    state.xp += r.success ? 18 + risk * 4 : 8;
    lines.push(...checkLevelUp());
    if (state.energy <= 10 && state.exhaustion < 4) { state.exhaustion++; lines.push("You're running on fumes. Exhaustion sets in."); }
    if (e.npc) adjustRel(e.npc.id, { love: r.success ? 3 : 0, lust: 2, trust: r.success ? 2 : -1 });
    if (!e.revealed) lines.push(`<em>Looking back, they were ${e.type.name.toLowerCase()}.</em>`);

    const pay = r.coin ? `You earn <b>${r.coin}</b> coin${r.tip ? ` (including a ${Math.floor(r.tip * netFactor(e.ctx))} tip)` : ""}${e.ctx === "brothel" ? " after the house's cut" : ""}.` : "You earn nothing.";
    lines.unshift(`${pay} +${rep} reputation.`);
    if (!troubleText && Narrator.on()) { const fin = Narrator.finish(e, r.success); if (fin) lines.unshift(fin + "\n"); }
    this.log(`${r.success ? "Satisfied" : "Unsatisfied"}: ${e.npc ? e.npc.name : "client"}, ${r.coin} coin.`);
    this.lastRoll = null;
    this.outcome(r.success ? "They leave satisfied" : "They leave unsatisfied", lines.join("\n"), null, { kicker: e.item.name, roll: troubleRoll || null });
  },

  /* ---------- Breakdown & endings ---------- */
  breakdown() {
    const bt = state.classFeatures.steadyNerves ? 3 : 5, bc = state.classFeatures.steadyNerves ? 5 : 10;
    state.trauma = Math.min(100, state.trauma + bt);
    state.stress = 60;
    state.control = Math.max(0, state.control - bc);
    state.health = Math.max(0, state.health - 5);
    this.log("Broke down under the strain.");
    const newDay = this.advanceClock();
    this.outcome("You break down", `The weight of it all lands at once. You lose the rest of the ${newDay ? "night" : "day's phase"} shaking in your room, unable to face anyone.\n\n<em>+${bt} trauma · −${bc} control. Stress settles at 60.</em>`, () => newDay ? this.dawnReport() : this.menu(), { kicker: "Stress 100" });
  },

  checkForcedEnding() {
    if (state.ended) { this.ending(state.ended); return true; }
    if (state.trauma >= 100 || state.health <= 0) { this.ending("burnout"); return true; }
    return false;
  },

  ending(key) {
    state.ended = key;
    this.setMode("ending");
    const s = state.stats;
    const end = ENDINGS[key];
    const endTitle = typeof end.title === "function" ? end.title() : end.title;
    const mot = MOTIVES[state.character.motivation];
    const motLine = mot ? `\n\n<em>${mot.done(key) ? mot.doneText : mot.failText}</em>` : "";
    this.log(`Ending: ${endTitle}.`);
    UI.scene({
      kicker: `The End · ${esc(state.character.name || "")}`, title: endTitle,
      body: `${end.text}${motLine}\n\n<em>${s.daysPlayed} days · ${s.bodyCount} clients · ${s.coinEarned} coin earned · level ${state.level} · ${getFameTier(state.fame).name}</em>`,
      chips: [{ text: `${classLabel(state.character.class)} · ${state.character.subclass || ""}`, cls: "gold" }]
    });
    UI.choices([
      { label: "Begin a new life", primary: true, action: () => this.newGame() },
      { label: "Load your last save", disabled: !this.hasSave(), reason: "No save", action: () => this.load() }
    ]);
  },

  /* ---------- Story ---------- */
  checkStory() {
    const st = state.story;
    const briar = rel("briar"), edric = rel("edric"), marlow = rel("marlow");
    if (!st.briarMentor && briar.trust >= 6) {
      st.briarMentor = true;
      state.skills.persuasion += 6; state.skills.insight += 4;
      const learned = grantClassPositions(1);
      if (state.stage === "brothel") state.houseCut = Math.max(0.1, state.houseCut - 0.05);
      this.log("Madam Briar took you under her wing.");
      this.outcome("Madam Briar's lesson", `Briar pours two glasses and talks for an hour: which men lie about their purses, how to end a bad night early, when to smile and when to stare. "You've got a head on you, ${esc(state.character.name)}," she says. "Don't waste it."\n\n<em>+6 Persuasion · +4 Insight${learned.length ? " · learned " + learned.join(", ") : ""}${state.stage === "brothel" ? " · house cut −5%" : ""}</em>`, null, { kicker: "A mentor" });
      return true;
    }
    if (!st.edric && edric.love >= 10 && edric.trust >= 5) {
      st.edric = true;
      this.setMode("event");
      this.log("Sir Edric made an offer.");
      UI.scene({ kicker: "An offer", title: "Sir Edric's proposal", body: `Sir Edric lingers after paying. "${esc(state.character.name)}," he says, "I have spoken to my steward." He would settle what you owe the city and take you to his estate — as his companion, kept in comfort, for as long as he cares to keep you.`, chips: [{ text: "Ends the game", cls: "gold" }] });
      UI.choices([
        { label: "Accept and leave with him", primary: true, action: () => this.ending("kept") },
        { label: "Decline gracefully", hint: "+5 control · he'll still visit", action: () => { state.control = clamp(state.control + 5, 0, 100); adjustRel("edric", { love: -3 }); this.outcome("You decline", "He takes it well, or pretends to. \"The offer stands,\" he says, though you both know it won't forever.", null); } }
      ]);
      return true;
    }
    if (!st.marlow && marlow.love >= 9) {
      st.marlow = true;
      this.setMode("event");
      this.log("Marlow asked you to leave with him.");
      UI.scene({ kicker: "A choice", title: "Marlow's plan", body: `Marlow has saved enough for two berths on a ship sailing south at dawn. He doesn't ask you to love him. "Come with me, ${esc(state.character.name)}," is all he says.`, chips: [{ text: "Ends the game", cls: "gold" }] });
      UI.choices([
        { label: "Go with him", primary: true, action: () => this.ending("runaway") },
        { label: "Stay", hint: "+3 control · it will sting", action: () => { state.control = clamp(state.control + 3, 0, 100); state.stress = clamp(state.stress + 8, 0, 100); adjustRel("marlow", { love: -5, trust: -2 }); this.outcome("You stay", "He nods like he expected it, and leaves the ticket on your pillow anyway.", null); } }
      ]);
      return true;
    }
    if (state.stage === "manager" && !st.briarManager) {
      st.briarManager = true;
      if (st.briarMentor && briar.trust >= 8) {
        state.houseReputation += 15;
        this.log("Madam Briar became your partner.");
        this.outcome("An old ally", "Briar sends her best clients your way and her worst rivals elsewhere. \"Someone has to run this city properly,\" she says.\n\n<em>+15 house reputation</em>", null, { kicker: "Madam Briar" });
      } else {
        state.houseReputation = Math.max(0, state.houseReputation - 5);
        this.log("Madam Briar became a rival.");
        this.outcome("A rival", "Word reaches you that Madam Briar is telling her regulars your house is cheap and dangerous. She doesn't like competition.\n\n<em>−5 house reputation</em>", null, { kicker: "Madam Briar" });
      }
      return true;
    }
    return false;
  },

  bargainCut(dc) {
    state.flags.cutTriedDay = state.day;
    const r = check(skillMeta("persuasion"), dc);
    if (r.success) {
      state.story.cutDeal = true;
      state.houseCut = Math.max(0.05, state.houseCut / 2);
      adjustRel("briar", { trust: 3 });
      this.outcome("A better cut", `Briar studies you a long moment, then laughs. "Fine. You've earned it." The house now takes ${Math.round(state.houseCut * 100)}%.`, null, { roll: r });
    } else {
      adjustRel("briar", { trust: -2 });
      this.outcome("Not today", `"Don't push your luck." Briar doesn't budge. Try again another day.`, null, { roll: r });
    }
  },

  /* ---------- Time ---------- */
  advanceClock() {
    state.flags.restedThisPhase = false;
    state.flags.clientsThisPhase = 0;
    state.flags.assignedThisPhase = false;
    state.phaseMods = { payMult: 1, trouble: 0, extraClients: 0, label: "" };
    if (state.phase === "morning") { state.phase = "afternoon"; return false; }
    if (state.phase === "afternoon") { state.phase = "night"; return false; }
    this.newDay();
    return true;
  },

  upkeep() { return state.stage === "street" ? 5 : state.stage === "brothel" ? 12 : 16; },
  wages() { return state.staffMembers.reduce((s, m) => s + 4 + Math.floor(m.skill / 10), 0); },
  charge(amount) {
    if (state.coin >= amount) { state.coin -= amount; return true; }
    state.debt += amount - state.coin;
    state.coin = 0;
    return false;
  },

  newDay() {
    const L = [];
    state.day++;
    state.stats.daysPlayed = state.day;
    state.phase = "morning";
    state.energy = Math.min(100, state.energy + 30);
    state.health = Math.min(maxHealth(), state.health + 5);
    state.stress = Math.max(0, state.stress - 5);
    state.trauma = Math.max(0, state.trauma - 2);
    state.control = Math.min(100, state.control + 2);
    if (state.exhaustion) state.exhaustion--;

    if (state.debt > 0) {
      const int = Math.max(1, Math.ceil(state.debt * 0.05));
      state.debt += int;
      state.debtDays++;
      L.push(`Interest on your debt: +${int}.`);
    }
    const up = this.upkeep();
    if (this.charge(up)) L.push(`Paid ${up} upkeep.`);
    else { state.stress = Math.min(100, state.stress + 8); state.reputation = Math.max(0, state.reputation - 1); L.push(`Couldn't cover ${up} upkeep. The shortfall goes on your debt.`); }

    if (state.stage === "manager" && state.staff) {
      const w = this.wages();
      if (state.coin >= w) { state.coin -= w; state.staffMembers.forEach(m => { m.loyalty = Math.min(100, m.loyalty + 1); }); L.push(`Paid ${w} in wages.`); }
      else { this.charge(w); state.staffMembers.forEach(m => { m.loyalty = Math.max(0, m.loyalty - 10); }); L.push(`Wages went unpaid. Your staff are angry.`); }
      for (const m of [...state.staffMembers]) {
        if (m.loyalty < 25 && Math.random() < 0.3) {
          if (Math.random() < 0.5 && state.coin > 0) {
            const stolen = Math.min(state.coin, 10 + Math.floor(Math.random() * 20));
            state.coin -= stolen;
            L.push(`${m.name} helped themself to ${stolen} coin from the strongbox.`);
          } else {
            state.staffMembers = state.staffMembers.filter(x => x !== m);
            L.push(`${m.name} packed up and left in the night.`);
          }
        }
      }
      syncStaff();
    }
    if (!state.debt) state.debtDays = 0;
    this.dawnLines = L;
    this.log(`Dawn of day ${state.day}. ${L.join(" ")}`);
    this.save(false);
  },

  endPhase() {
    const newDay = this.advanceClock();
    if (newDay) { this.dawnReport(); return; }
    this.afterPhase();
  },

  dawnReport() {
    const L = this.dawnLines || [];
    this.outcome(`Day ${state.day}`, (L.length ? L.join("\n") : "A quiet night.") + "\n\n<em>The game has been saved.</em>", () => this.afterDawn(), { kicker: "Dawn" });
  },

  afterDawn() {
    if (state.debt > 0 && state.debtDays >= 3) { this.creditor(); return; }
    this.afterPhase();
  },

  afterPhase() {
    if (Math.random() < 0.3) {
      const pool = EVENTS.filter(ev => ev.when());
      if (pool.length) { pick(pool).run(); return; }
    }
    this.menu();
  },

  creditor() {
    this.setMode("event");
    this.log("A creditor came calling.");
    UI.scene({ kicker: `Debt ${state.debt}`, title: "A creditor at the door", body: "A broad man with a ledger and a cudgel leans in your doorway. \"You owe. My employer is losing patience.\"", chips: [{ text: `${state.debtDays} days overdue`, cls: "warn" }] });
    const pm = skillMeta("persuasion", { bonus: state.upgrades.bodyguard ? 2 : 0 }), dc = 12 + controlMod();
    const beaten = () => { state.health = Math.max(0, state.health - 20); state.trauma = Math.min(100, state.trauma + 4); state.reputation = Math.max(0, state.reputation - 2); state.debtDays = 0; };
    UI.choices([
      { label: "Pay what you can", hint: `Hand over ${Math.min(state.coin, state.debt)} coin`, disabled: state.coin < 1, reason: "You have nothing", action: () => {
        const amt = Math.min(state.coin, state.debt); state.coin -= amt; state.debt -= amt; state.debtDays = state.debt ? 1 : 0;
        this.outcome("Paid", `He counts it twice and leaves.${state.debt ? ` You still owe ${state.debt}.` : " You're clear."}`, () => this.menu());
      } },
      { label: "Ask for more time", hint: "Persuasion · fail: a beating", odds: odds(pm, dc), action: () => {
        const r = check(pm, dc);
        if (r.success) { state.debtDays = 0; state.stress = clamp(state.stress + 3, 0, 100); this.outcome("A reprieve", "He grunts and writes something in his ledger. \"Three days.\"", null, { roll: r }); }
        else { beaten(); this.outcome("No more time", "He doesn't like your excuses. You'll be sore for days.\n\n<em>−20 health · +4 trauma · −2 reputation</em>", null, { roll: r }); }
      } },
      { label: "Refuse", hint: "−20 health · +4 trauma · −2 rep", danger: true, action: () => { beaten(); this.outcome("You refuse", "He makes his point the old way, then leaves.", null); } }
    ]);
  },

  /* ---------- Actions ---------- */
  rest() {
    if (state.flags.restedThisPhase) return this.refresh();
    state.flags.restedThisPhase = true;
    const worked = state.flags.clientsThisPhase > 0;
    let gain = worked ? 22 : 12;
    if (state.classFeatures.quickRecovery) gain += 8;
    if (state.classFeatures.restful) gain += 5;
    state.energy = Math.min(100, state.energy + gain);
    state.health = Math.min(maxHealth(), state.health + (worked ? 8 : 4));
    state.stress = Math.max(0, state.stress - (worked ? 8 : 4));
    if (state.exhaustion && state.energy >= 50) state.exhaustion--;
    UI.toast(worked ? "You rest well." : "A light rest.");
    this.refresh();
  },

  payDebt() {
    const amt = Math.min(state.coin, state.debt);
    state.coin -= amt; state.debt -= amt;
    if (!state.debt) state.debtDays = 0;
    this.log(`Paid ${amt} toward debt.`);
    UI.toast(state.debt ? `Paid ${amt}. ${state.debt} left.` : "Debt cleared!");
    this.refresh();
  },

  assignStaff() {
    if (!state.staff || state.flags.assignedThisPhase) return this.refresh();
    state.flags.assignedThisPhase = true;
    let income = 0;
    state.staffMembers.forEach(m => {
      income += Math.floor(4 + m.skill / 6 + m.loyalty / 20 + state.houseReputation / 10);
      m.skill = Math.min(90, m.skill + 1);
    });
    state.coin += income;
    state.houseReputation += 1;
    state.stats.coinEarned += income;
    this.log(`Staff earned ${income} coin.`);
    UI.toast(`Your staff bring in ${income} coin.`);
    this.refresh();
  },

  hireStaff() {
    if (state.coin < 45) return this.refresh();
    state.coin -= 45;
    const names = ["Lila", "Mara", "Sera", "Tess", "Wren", "Nia", "Rosalind", "Ysolde", "Cass", "Elin", "Bram", "Joss"];
    const used = state.staffMembers.map(m => m.name);
    const name = names.find(n => !used.includes(n)) || names[state.staffMembers.length % names.length] + " II";
    state.staffMembers.push({ name, skill: 25 + Math.floor(Math.random() * 25), loyalty: 55 });
    syncStaff();
    this.log(`Hired ${name}.`);
    UI.toast(`${name} joins the house.`);
    this.refresh();
  },

  treatStaff() {
    const cost = state.staff * 6;
    if (!state.staff || state.coin < cost || state.flags.treatedDay === state.day) return this.refresh();
    state.coin -= cost;
    state.flags.treatedDay = state.day;
    state.staffMembers.forEach(m => { m.loyalty = Math.min(100, m.loyalty + 8); });
    UI.toast("Wine and a good supper. Spirits lift.");
    this.refresh();
  },

  improveHouse() {
    if (state.coin < 35) return this.refresh();
    state.coin -= 35;
    state.houseReputation += 6;
    this.log("Improved the house.");
    UI.toast("New drapes, better wine. The house improves.");
    this.refresh();
  },

  buy(item) {
    if (state.coin < priceOf(item) || (item.once && state.upgrades[item.id])) return this.refresh();
    state.coin -= priceOf(item);
    if (item.once) state.upgrades[item.id] = true;
    if (item.id === "physician") state.health = Math.min(maxHealth(), state.health + 30);
    if (item.id === "tonic") state.stress = Math.max(0, state.stress - 15);
    if (item.id === "sanctuary") { state.trauma = Math.max(0, state.trauma - 12); state.stress = Math.max(0, state.stress - 10); }
    if (item.id === "bathhouse") { state.energy = Math.min(100, state.energy + 25); if (state.exhaustion) state.exhaustion--; }
    this.log(`Bought: ${item.name}.`);
    UI.toast(`Bought ${item.name.toLowerCase()}.`);
    this.refresh();
  },

  /* ---------- Save / load ---------- */
  hasSave() { try { return !!(localStorage.getItem("courtesan-v3") || localStorage.getItem("courtesan-v2")); } catch (e) { return false; } },
  save(manual) {
    try {
      localStorage.setItem("courtesan-v3", JSON.stringify(state));
      if (manual) { UI.toast("Saved."); this.refresh(); }
    } catch (e) { if (manual) { UI.toast("Couldn't save in this browser."); this.refresh(); } }
  },
  load() {
    try {
      const raw = localStorage.getItem("courtesan-v3") || localStorage.getItem("courtesan-v2");
      if (!raw) { UI.toast("No save found."); return this.refresh(); }
      const merged = deepMerge(JSON.parse(JSON.stringify(DEFAULT_STATE)), JSON.parse(raw));
      merged.knownPositions = (merged.knownPositions || []).filter(isPosition);
      if (!merged.knownPositions.length) merged.knownPositions = ["missionary"];
      merged.encounter = null;
      merged.staffMembers = (merged.staffMembers || []).map(m => ({ loyalty: 50, ...m }));
      const mc = merged.character;
      mc.gender = (mc.gender === "male" || mc.gender === "man") ? "male" : "female";
      if (mc.build === "curvaceous") mc.build = "sturdy";
      if (!BUILDS[mc.build]) mc.build = "average";
      if (!mc.name) mc.name = pick(NAMES[mc.gender]);
      delete merged.logHistory;
      Object.keys(state).forEach(k => delete state[k]);
      Object.assign(state, merged);
      syncStaff();
      UI.skipDeltas = true;
      UI.toast("Loaded.");
      UI.tab = "work"; $("work").hidden = false; $("view").hidden = true;
      this.menu();
    } catch (e) { UI.toast("That save couldn't be read."); this.refresh(); }
  },

  newGame() {
    const fresh = JSON.parse(JSON.stringify(DEFAULT_STATE));
    Object.keys(state).forEach(k => delete state[k]);
    Object.assign(state, fresh);
    this.lastRoll = null;
    UI.skipDeltas = true;
    UI.tab = "work"; $("work").hidden = false; $("view").hidden = true;
    Creation.start(true);
  }
};

function nameOf(id) {
  const p = INDEX.positions.find(x => x.id === id) || INDEX.kinks.find(x => x.id === id);
  return p ? p.name : id;
}

const POINT_COST = { 8: 0, 9: 1, 10: 2, 11: 3, 12: 4, 13: 5, 14: 7, 15: 9 };
const POINT_BUDGET = 27;
const ATTR_KEYS = ["str", "dex", "con", "int", "wis", "cha"];
function pointsSpent(a) { return ATTR_KEYS.reduce((s, k) => s + POINT_COST[a[k]], 0); }
function traitPointsLeft(d) {
  let p = 0;
  d.traits.forEach(id => {
    const n = TRAITS.neg.find(x => x.id === id), q = TRAITS.pos.find(x => x.id === id);
    if (n) p += n.grant;
    if (q) p -= q.cost;
  });
  if (d.feat && FEATS[d.feat]) p -= FEATS[d.feat].cost;
  return p;
}
function learnFor(t, id) { if (isPosition(id) && !t.knownPositions.includes(id)) t.knownPositions.push(id); }
function bonusFor(t, skill) {
  const raw = t.skills[skill] || 0;
  return getMod(t.attributes[SKILL_ATTR[skill]]) + (raw >= 20 ? t.proficiencyBonus : 0) + Math.floor(raw / 25);
}

// Applies a creation draft to a fresh state object. Pure with respect to the draft.
function applyDraft(t, d) {
  Object.assign(t.character, {
    name: d.name, gender: d.gender, appearance: d.appearance, build: d.build, experience: d.difficulty,
    class: d.cls, subclass: d.sub, background: d.background, motivation: d.motive,
    traits: [...d.traits], feat: d.feat && FEATS[d.feat] ? FEATS[d.feat].name : null
  });
  t.attributes = { ...d.attrs };
  DIFFICULTIES[d.difficulty].apply(t);
  if (d.cls && CLASSES[d.cls]) {
    CLASSES[d.cls].apply(t);
    (CLASS_POSITIONS[d.cls] || []).slice(0, 2).forEach(id => learnFor(t, id));
    const s = d.sub && SUBCLASSES[d.cls].find(x => x.id === d.sub);
    if (s) { s.apply(t); (SUBCLASS_POSITIONS[d.sub] || []).forEach(id => learnFor(t, id)); }
  }
  if (BUILDS[d.build]) t.classFeatures[BUILDS[d.build].feature] = true;
  if (d.background && BACKGROUNDS[d.background]) BACKGROUNDS[d.background].apply(t);
  if (d.motive && MOTIVES[d.motive] && MOTIVES[d.motive].apply) MOTIVES[d.motive].apply(t);
  d.traits.forEach(id => { const x = TRAITS.pos.find(q => q.id === id) || TRAITS.neg.find(q => q.id === id); if (x) x.apply(t); });
  if (d.feat && FEATS[d.feat]) t.classFeatures[d.feat] = true;
  t.traitPoints = Math.max(0, traitPointsLeft(d));
  return t;
}

    d.cls = pick(Object.keys(CLASSES));
    d.sub = pick(SUBCLASSES[d.cls]).id;
    d.attrs = { ...CLASSES[d.cls].rec };
    d.background = pick(Object.keys(BACKGROUNDS));
    d.motive = pick(Object.keys(MOTIVES));
    shuffle(TRAITS.neg).slice(0, Math.floor(Math.random() * 3)).forEach(t => d.traits.push(t.id));
    let nPos = 0;
    shuffle(TRAITS.pos).forEach(t => { if (nPos < 2 && traitPointsLeft(d) >= t.cost && Math.random() < 0.7) { d.traits.push(t.id); nPos++; } });
    const feats = Object.keys(FEATS).filter(k => FEATS[k].cost <= traitPointsLeft(d));
    if (feats.length && Math.random() < 0.7) d.feat = pick(feats);
    return d;
  },

  finish() {
    const d = this.d;
    if (!d.name) d.name = pick(NAMES[d.gender]);
    const next = applyDraft(freshState(), d);
    Object.keys(state).forEach(k => delete state[k]);
    Object.assign(state, next);
    this.editing = false; this.prevVals = null;
    UI.skipDeltas = true;
    const c = state.character;
    Game.log(`${c.name} began a new life: ${classLabel(c.class)} (${c.subclass}), ${c.background}.`);
    Game.outcome("The streets await",
      `You are <b>${esc(c.name)}</b>, ${an(c.appearance)} ${c.appearance} ${buildWord(c.build).toLowerCase()} ${pr("noun")} — ${an(classLabel(c.class))} ${classLabel(c.class)} of the ${c.subclass} school, once ${an(c.background)} ${c.background.toLowerCase()}.\n\n${MOTIVES[c.motivation].intro}\n\nYou have ${state.coin} coin, a few techniques, and a corner of the city to work. Rise high enough and you'll have a room in a brothel. Rise higher and the house will be yours.\n\n<em>Tip: size up each client before accepting. The percentage on each choice is your chance of success.</em>`,
      () => Game.menu(), { kicker: "Day 1", cta: "Begin" });
  }
};

/* =========================================================
   BOOT
   ========================================================= */
UI.renderTabs();
Creation.start(false);
</script>
